<!DOCTYPE html>
<!--
  Serve Tracker
  Single-file PWA: tennis serve practice tracker (1st serve in / 2nd
  serve in / double fault) with a donut chart, session history, a
  trends chart, French/English UI, and JSON export/import backup.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Serve Tracker</title>
<meta name="theme-color" content="#14231A">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --court:      #14231A;
    --surface:    #1D3226;
    --surface-2:  #26402F;
    --line:       #EDEAE1;
    --muted:      #7C9285;
    --first:      #4E9B5E;
    --second:     #E8C93D;
    --fault:      #D6483F;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--court);
    color: var(--line);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    padding: 14px 14px 16px;
  }

  /* header */
  header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
  h1{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.04em;
    text-transform:uppercase; font-size:15px; color: var(--muted); margin:0;
  }
  #reset-btn, #history-btn{
    background:none; border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.03em;
    padding:6px 10px; border-radius:20px; text-transform:uppercase;
  }
  #reset-btn:active, #history-btn:active{ background:var(--surface-2); color:var(--line); }

  #lang-select{
    background:var(--court); border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.03em;
    padding:6px 8px; border-radius:20px; text-transform:uppercase;
  }
  #help-btn{
    background:none; border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Oswald',sans-serif; font-weight:600; font-size:12px;
    width:26px; height:26px; border-radius:50%; padding:0; line-height:1;
  }
  #help-btn:active{ background:var(--surface-2); color:var(--line); }

  #export-banner{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border-radius:14px; padding:9px 12px;
    margin-bottom:8px; font-size:11px; color:var(--line);
  }
  #export-banner.show{ display:flex; }
  #banner-export-btn{
    background:var(--first); color:#14231A; border:none;
    font-family:'Inter',sans-serif; font-weight:600; font-size:11px;
    padding:5px 10px; border-radius:12px; text-transform:uppercase;
  }
  #banner-dismiss-btn{
    background:none; border:none; color:var(--muted); font-size:14px; padding:2px 4px;
  }

 /* "New version available" banner.

   Doesn't appear during normal use — only when the browser already has an
   older cached version of the app (from a previous visit) and a newer
   version has since been deployed. 
   
   Requires HTTPS; so never appears when opened via file://, since service 
   workers need a secure context to run at all.

   As a consequence, doesn't show up on a normal test run either, since the 
   test suite loads the app via file://. */

  #update-banner{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border-radius:14px; padding:9px 12px;
    margin-bottom:8px; font-size:11px; color:var(--line);
  }
  #update-banner.show{ display:flex; }
  #update-reload-btn{
    background:var(--first); color:#14231A; border:none;
    font-family:'Inter',sans-serif; font-weight:600; font-size:11px;
    padding:5px 10px; border-radius:12px; text-transform:uppercase;
  }

  #history-overlay, #help-overlay{
    display:none; position:fixed; inset:0; background:rgba(10,17,13,0.88);
    z-index:10; padding:14px;
  }
  #history-overlay.open, #help-overlay.open{ display:flex; }
  #history-panel, #help-panel{
    background:var(--surface); border-radius:18px; width:100%; max-height:100%;
    display:flex; flex-direction:column; overflow:hidden; margin:auto;
  }
  #history-head, #help-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; border-bottom:1px solid var(--surface-2);
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:14px;
  }
  #history-close, #help-close{
    background:none; border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Inter',sans-serif; font-size:11px; padding:5px 9px; border-radius:16px; text-transform:uppercase;
  }
  #help-body{
    overflow-y:auto; padding:14px 18px 20px; font-size:13px; line-height:1.55;
  }
  #help-body h3{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em;
    font-size:12px; color:var(--first); margin:16px 0 6px;
  }
  #help-body h3:first-child{ margin-top:0; }
  #help-body p, #help-body li{ color:var(--line); margin:0 0 4px; }
  #help-body ul{ margin:4px 0 4px 18px; padding:0; }
  #help-body b{ color:var(--second); }
  #history-list{ overflow-y:auto; padding:8px 16px 16px; }
  .hist-item{
    padding:10px 0; border-bottom:1px solid var(--surface-2);
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .hist-item:last-child{ border-bottom:none; }
  .hist-name{ font-weight:600; font-size:13px; }
  .hist-date{ font-size:11px; color:var(--muted); margin-top:2px; }
  .hist-stats{ font-family:'Oswald',sans-serif; font-size:12px; color:var(--muted); text-align:right; white-space:nowrap; }
  .hist-delete{
    background:none; border:1px solid var(--fault); color:var(--fault);
    font-family:'Inter',sans-serif; font-size:10px; padding:5px 8px; border-radius:14px;
    text-transform:uppercase; flex:0 0 auto;
  }
  .hist-delete:active{ background:var(--fault); color:#F5E9E6; }
  .hist-empty{ color:var(--muted); font-size:13px; text-align:center; padding:24px 0; }

  #history-tabs{ display:flex; gap:8px; padding:12px 16px 0; flex-wrap:wrap; row-gap:8px; }
  .hist-tab{
    background:none; border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.03em;
    padding:6px 12px; border-radius:16px; text-transform:uppercase;
  }
  .hist-tab.active{ background:var(--surface-2); color:var(--line); }

  #export-btn, #import-btn{
    background:none; border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.03em;
    padding:6px 12px; border-radius:16px; text-transform:uppercase;
  }
  #export-btn{ margin-left:auto; }
  #export-btn:active, #import-btn:active{ background:var(--surface-2); color:var(--line); }

  #auto-backup-row{
    display:none; align-items:center; justify-content:space-between; gap:8px;
    margin:10px 16px 0; padding:8px 10px; background:var(--surface-2); border-radius:12px;
  }
  #auto-backup-row.show{ display:flex; }
  .auto-backup-status{ font-size:11px; color:var(--line); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #enable-auto-backup-btn, #disable-auto-backup-btn{
    background:none; border:1px solid var(--muted); color:var(--line);
    font-family:'Inter',sans-serif; font-size:11px; padding:5px 10px; border-radius:14px;
    text-transform:uppercase; flex:0 0 auto;
  }

  #history-chart-view{ display:none; padding:6px 16px 16px; }
  #evo-chart{ width:100%; display:block; }
  #evo-legend{ display:flex; gap:14px; justify-content:center; margin-top:8px; }
  #evo-legend span{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
  #evo-legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  #evo-note{ text-align:center; font-size:10px; color:var(--muted); margin-top:6px; }

  /* stats zone */
  #stats{
    background:var(--surface);
    border-radius:18px;
    padding: 12px 14px 14px;
    display:flex; align-items:center; gap:14px;
    flex: 0 0 auto;
  }
  #chart-wrap{ position:relative; width:104px; height:104px; flex:0 0 auto; }
  canvas{ display:block; }
  #chart-center{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  #chart-center .n{ font-family:'Oswald',sans-serif; font-size:26px; font-weight:600; line-height:1; }
  #chart-center .lbl{ font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px; }

  #legend{ flex:1; display:flex; flex-direction:column; gap:7px; min-width:0; }
  .leg-row{ display:flex; align-items:center; gap:8px; }
  .dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .leg-text{ display:flex; flex-direction:column; flex:1; min-width:0; }
  .leg-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; }
  .leg-value{ font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; }
  .leg-value span{ color:var(--muted); font-family:'Inter',sans-serif; font-size:11px; font-weight:400; margin-left:7px; }

  /* second-serve save rate, subtle secondary line */
  #sub-stat{
    text-align:center; font-size:11px; color:var(--muted); margin: 8px 2px 0;
    letter-spacing:0.01em;
  }
  #sub-stat b{ color:var(--line); font-weight:600; }

  /* buttons */
  #buttons{
    flex:1; display:flex; flex-direction:column; gap:12px; margin-top:14px; min-height:0;
  }
  button.serve{
    flex:1; border:none; border-radius:20px;
    font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase;
    letter-spacing:0.03em; font-size:22px;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.06s ease;
    color: #14231A;
  }
  button.serve:active{ transform: scale(0.97); }
  #btn-first{ background: var(--first); }
  #btn-second{ background: var(--second); }
  #btn-fault{ background: var(--fault); color:#F5E9E6; flex:0 0 22%; font-size:19px; }

  button.serve .count{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    margin-left:10px; padding:2px 9px; border-radius:12px;
    background: rgba(20,35,26,0.18);
  }
  #btn-fault .count{ background: rgba(0,0,0,0.18); }
</style>
</head>
<body>
<div id="app">
  <!-- Top bar: title, language switch, help, history, and reset controls -->
  <header>
    <h1 data-i18n="title">Serve session</h1>
    <div style="display:flex; gap:8px; align-items:center;">
      <select id="lang-select"></select>
      <button id="help-btn">?</button>
      <button id="history-btn" data-i18n="history">History</button>
      <button id="reset-btn" data-i18n="reset">Reset</button>
    </div>
  </header>

  <!-- Reminder to export/back up data, shown by checkExportReminder() when
       it's been 7+ days (or never) since the last export -->
  <div id="export-banner">
    <span data-i18n="exportReminder">Consider exporting your data once in a while.</span>
    <div style="display:flex; gap:6px;">
      <button id="banner-export-btn" data-i18n="exportBtn">Export</button>
      <button id="banner-dismiss-btn">✕</button>
    </div>
  </div>

  <!-- Shown by AppUpdater when a new service worker version is installed
       and waiting to take over -->
  <div id="update-banner">
    <span data-i18n="updateAvailable">A new version is available.</span>
    <button id="update-reload-btn" data-i18n="updateBtn">Update</button>
  </div>

  <!-- Help overlay: static instructions panel, opened via the "?" button -->
  <div id="help-overlay">
    <div id="help-panel">
      <div id="help-head">
        <span data-i18n="helpTitle">Help</span>
        <button id="help-close" data-i18n="close">Close</button>
      </div>
      <div id="help-body"></div>
    </div>
  </div>

  <!-- History overlay: past sessions (List tab) or the Trends chart (Trends
       tab), plus export/import and linked-backup-file controls -->
  <div id="history-overlay">
    <div id="history-panel">
      <div id="history-head">
        <span data-i18n="historyTitle">Session history</span>
        <button id="history-close" data-i18n="close">Close</button>
      </div>
      <!-- List/Trends tab switch, plus manual backup (export/import) -->
      <div id="history-tabs">
        <button class="hist-tab active" data-view="list" data-i18n="tabList">List</button>
        <button class="hist-tab" data-view="chart" data-i18n="tabChart">Trends</button>
        <button id="export-btn" data-i18n="exportBtn">Export</button>
        <button id="import-btn" data-i18n="importBtn">Import</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;">
      </div>
      <!-- File System Access auto-backup control, filled in by
           renderAutoBackupRow(); stays empty when the API isn't supported -->
      <div id="auto-backup-row"></div>
      <!-- List tab content, filled in by renderHistoryPanel() -->
      <div id="history-list"></div>
      <!-- Trends tab content: line chart painted by evolutionPane.render() -->
      <div id="history-chart-view">
        <canvas id="evo-chart" height="180"></canvas>
        <div id="evo-legend">
          <span><i style="background:var(--first)"></i><span data-i18n="firstServe">1st serve</span></span>
          <span><i style="background:var(--second)"></i><span data-i18n="secondServe">2nd serve</span></span>
          <span><i style="background:var(--fault)"></i><span data-i18n="doubleFault">Double fault</span></span>
        </div>
        <div id="evo-note" data-i18n="chronoNote">Sessions in chronological order (left → right)</div>
      </div>
    </div>
  </div>

  <!-- Current session: donut chart + legend, driven by state/renderCurrentTennisSession() -->
  <div id="stats">
    <div id="chart-wrap">
      <canvas id="chart" width="104" height="104"></canvas>
      <div id="chart-center">
        <div class="n" id="total-n">0</div>
        <div class="lbl" data-i18n="points">points</div>
      </div>
    </div>
    <div id="legend">
      <div class="leg-row">
        <div class="dot" style="background:var(--first)"></div>
        <div class="leg-text">
          <div class="leg-label" data-i18n="firstServe">1st serve</div>
          <div class="leg-value" id="leg-first">0<span>0%</span></div>
        </div>
      </div>
      <div class="leg-row">
        <div class="dot" style="background:var(--second)"></div>
        <div class="leg-text">
          <div class="leg-label" data-i18n="secondServe">2nd serve</div>
          <div class="leg-value" id="leg-second">0<span>0%</span></div>
        </div>
      </div>
      <div class="leg-row">
        <div class="dot" style="background:var(--fault)"></div>
        <div class="leg-text">
          <div class="leg-label" data-i18n="doubleFault">Double fault</div>
          <div class="leg-value" id="leg-fault">0<span>0%</span></div>
        </div>
      </div>
    </div>
  </div>

  <div id="sub-stat"><span data-i18n="secondRateLabel">2nd serve conversion rate: </span><b id="second-rate">—</b></div>

  <!-- The three serve-recording buttons -->
  <div id="buttons">
    <button class="serve" id="btn-first"><span data-i18n="firstServe">1st serve</span> <span class="count" id="c-first">0</span></button>
    <button class="serve" id="btn-second"><span data-i18n="secondServe">2nd serve</span> <span class="count" id="c-second">0</span></button>
    <button class="serve" id="btn-fault"><span data-i18n="doubleFault">Double fault</span> <span class="count" id="c-fault">0</span></button>
  </div>
</div>

<script>
// --- i18n ---------------------------------------------------------------
// Add a new language by adding a block below with the same keys as fr/en.
// The <select> and every element with [data-i18n] update automatically.
const LANG_KEY = 'app-lang';

const translations = {
  fr: {
    langName: 'Français',
    locale: 'fr-CA',
    title: 'Session de service',
    reset: 'Réinitialiser',
    history: 'Historique',
    historyTitle: 'Historique des sessions',
    close: 'Fermer',
    tabList: 'Liste',
    tabChart: 'Évolution',
    points: 'points',
    firstServe: '1er service',
    secondServe: '2e service',

    emptyHistory: "Aucune session sauvegardée pour l'instant.",
    saveSessionPrompt: 'Sauvegarder la session ?',

    chronoNote: "Sessions dans l'ordre chronologique (gauche → droite)",
    notEnoughSessions: 'Pas encore assez de sessions.',

    importError: "Ce fichier n'est pas une sauvegarde valide.",
    exportReminder: 'Pense à exporter tes données de temps en temps.',

      <p>Cette appli t'aide à comptabiliser les résultats de ton service pendant ta routine de pratique au tennis : 1er service réussi, 2e service réussi, ou double faute — avec des statistiques et un historique pour suivre ta progression.</p>

      <h3>Les trois boutons</h3>
      <p><b>1er service</b> : touche-le quand ton premier service rentre.<br>

    delete: 'Delete',
    emptyHistory: 'No sessions saved yet.',

    deleteConfirm: 'Delete this session from history?',

    helpTitle: 'Help',
    helpBody: `
      <p>This app helps you track your tennis serve practice results — 1st serve in, 2nd serve in, or double fault — with stats and a history to follow your progress over time.</p>

      <p><b>1st serve</b>: tap when your first serve goes in.<br>

let currentLang = 'fr';

// Shorthand to fetch a translated string for the active language.
function t(key){ return translations[currentLang][key]; }

function translateUI(lang){
  currentLang = translations[lang] ? lang : 'fr';
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(translations[currentLang][key] !== undefined){
      el.textContent = translations[currentLang][key];

  document.getElementById('help-body').innerHTML = translations[currentLang].helpBody;
  try{ localStorage.setItem(LANG_KEY, currentLang); }catch(e){}
  renderCurrentTennisSession();
  if(document.getElementById('history-overlay').classList.contains('open')){
    renderHistoryPanel();
    if(document.getElementById('history-chart-view').style.display !== 'none'){
      evolutionPane.render();
    }
  }
}

  const sel = document.getElementById('lang-select');
  sel.innerHTML = Object.keys(translations).map(code =>
    '<option value="' + code + '">' + translations[code].langName + '</option>'
  ).join('');

  try{ saved = localStorage.getItem(LANG_KEY) || 'fr'; }catch(e){}
  sel.value = translations[saved] ? saved : 'fr';
  sel.addEventListener('change', () => translateUI(sel.value));
  translateUI(sel.value);

// --- State of the current tennis serving session  ----------------------------------------------
// The only three numbers that matter: how many times each button was tapped
// (1st serve in, 2nd serve in, double fault) since the last reset.
let state = { first: 0, second: 0, fault: 0 };

const colors = { first: '#4E9B5E', second: '#E8C93D', fault: '#D6483F' };

// --- DonutChart: the current-session donut (model + the canvas it's
// painted to) --------------------------------------------------------------
class DonutChart {
  static TWELVE_OCLOCK_RADIANS = -Math.PI / 2;

  constructor(){
    this.canvas = document.getElementById('chart');
    this.ctx = this.canvas.getContext('2d');
  }

  computeSegments(sessionState){
    const totalPoints = sessionState.first + sessionState.second + sessionState.fault;
    if(totalPoints === 0){
      return { totalPoints: 0, segments: [] };
    }

    const order = [
      { key: 'first',  value: sessionState.first,  color: colors.first },
      { key: 'second', value: sessionState.second, color: colors.second },
      { key: 'fault',  value: sessionState.fault,  color: colors.fault },
    ];

    let startAngleRadians = DonutChart.TWELVE_OCLOCK_RADIANS;
    const segments = [];
    order.forEach(item => {
      if(item.value === 0) return;
      const fraction = item.value / totalPoints;
      const sweepClockwiseRadians = fraction * Math.PI * 2;
      segments.push({
        key: item.key,
        value: item.value,
        percentage: Math.round(fraction * 100),
        color: item.color,
        startAngleRadians,
        endAngleRadians: startAngleRadians + sweepClockwiseRadians,
      });
      startAngleRadians += sweepClockwiseRadians;
    });

    return { totalPoints, segments };
  }

  // Donut chart: the colored circular chart that displays the percentages
  // of 1st serve, 2nd serve, and double faults, with the total number of
  // points in the middle.
  render(sessionState){
    const { canvas, ctx } = this;
    const w = canvas.width, h = canvas.height;
    const cx = w/2, cy = h/2, rOuter = w/2 - 4, rInner = rOuter * 0.6;
    ctx.clearRect(0,0,w,h);

    const { totalPoints, segments } = this.computeSegments(sessionState);

    if(totalPoints === 0){
      this._drawEmptyRing(cx, cy, rOuter, rInner);
      return;
    }

    segments.forEach(seg => {
      ctx.beginPath();
      // startAngleRadians/endAngleRadians already use ctx.arc()'s own angle
      // convention, so they're passed straight through with no conversion.
      ctx.arc(cx, cy, (rOuter+rInner)/2, seg.startAngleRadians, seg.endAngleRadians);
      ctx.lineWidth = rOuter - rInner;
      ctx.strokeStyle = seg.color;
      ctx.stroke();
    });
  }

  _drawEmptyRing(cx, cy, rOuter, rInner){
    const { ctx } = this;
    ctx.beginPath();
    ctx.arc(cx, cy, rOuter, 0, Math.PI*2);
    ctx.strokeStyle = '#2A4433';
    ctx.lineWidth = rOuter - rInner;
    ctx.stroke();
  }
}

const donutChart = new DonutChart();

function percent(count, total){ return total === 0 ? 0 : Math.round((count/total)*100); }

function displayCurrentServeStatistics(){
  const total = state.first + state.second + state.fault;
  document.getElementById('total-n').textContent = total;

  document.getElementById('c-first').textContent = state.first;
  document.getElementById('c-second').textContent = state.second;
  document.getElementById('c-fault').textContent = state.fault;

  document.getElementById('leg-first').innerHTML = percent(state.first, total) + '%<span>' + state.first + ' ' + t('shots') + '</span>';
  document.getElementById('leg-second').innerHTML = percent(state.second, total) + '%<span>' + state.second + ' ' + t('shots') + '</span>';
  document.getElementById('leg-fault').innerHTML = percent(state.fault, total) + '%<span>' + state.fault + ' ' + t('shots') + '</span>';

  const secondAttempts = state.second + state.fault;
  document.getElementById('second-rate').textContent =
    secondAttempts === 0 ? '—' : percent(state.second, secondAttempts) + '% (' + state.second + '/' + secondAttempts + ')';
}

function renderCurrentTennisSession(){
  displayCurrentServeStatistics();
  donutChart.render(state);
}

// This class saves app data to a persistent data store.
//
// Day to day, the current tennis session and the history are each saved as their
// own JSON blob to the browser's local data store (localStorage) — the
// default, and the only thing that works everywhere. Its problem: the
// browser may erase it without notice.
//
// As a safety net against that, the session and history are also combined
// into a single JSON object and written out as a backup, two ways:
//   - automatically, to a file outside the browser's data store, on
//     configurations that support it
//   - manually, whenever the user exports their data to a safe location
//     of their choice
//
// `state` itself is NOT owned here — it's a page-level variable, passed in
// by whichever method needs it.
//
class DataStore {
  static SESSION_KEY = 'serve-stats';
  static HISTORY_KEY = 'history-sessions';
  static EXPORT_DATE_KEY = 'last-export-date';

  // window.showSaveFilePicker is desktop Chrome/Edge only — no mobile
  // browser implements it (Chrome on iOS is a Safari wrapper, and Safari
  // itself doesn't have it either; Chrome on Android doesn't implement it
  // regardless of platform) — and it needs a secure context. Where it's
  // unsupported, the auto-backup methods below are simply never called;
  // the plain-download path in exportDB() is the fallback that always
  // works everywhere, which is why both paths exist side by side.
  static get supportsAutoBackup(){
    return ('showSaveFilePicker' in window) && window.isSecureContext;
  }

  constructor(){
    this.autoBackupFileHandle = null;
  }

  // --- current tennis session ---------------------------------------------
  saveCurrentSession(state){
    try{
      localStorage.setItem(DataStore.SESSION_KEY, JSON.stringify(state));
    }catch(e){ console.error('Failed to save', e); }
  }

  loadCurrentSession(){
    try{
      const raw = localStorage.getItem(DataStore.SESSION_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        return { first: parsed.first||0, second: parsed.second||0, fault: parsed.fault||0 };
      }
    }catch(e){
      // no saved data yet — caller keeps its own default state
    }
    return { first: 0, second: 0, fault: 0 };
  }

  // --- session history -----------------------------------------------------
  // Each saved session is { name, date (ISO string), first, second, fault }.
  // Stored as one JSON array, newest entry first (unshift).
  async loadHistory(){
    try{
      const raw = localStorage.getItem(DataStore.HISTORY_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ /* no history yet */ }
    return [];
  }

  async saveHistory(list){
    try{
      localStorage.setItem(DataStore.HISTORY_KEY, JSON.stringify(list));
    }catch(e){ console.error('Failed to save history', e); }
  }

  async addSessionToHistory(name, state){
    const list = await this.loadHistory();
    list.unshift({
      name,
      date: new Date().toISOString(),
      first: state.first,
      second: state.second,
      fault: state.fault,
    });
    await this.saveHistory(list);
  }

  // --- backup object: shared by both exportDB() (manual download) and
  // writeAutoBackup() (automatic) below, so the two paths can never drift
  // into building different-shaped backups.
  async buildBackupObject(state){
    const history = await this.loadHistory();
    return { exportedAt: new Date().toISOString(), currentSession: state, history };
  }

  recordExportNow(){
    try{ localStorage.setItem(DataStore.EXPORT_DATE_KEY, new Date().toISOString()); }catch(e){}
  }

  daysSinceLastExport(){
    let lastExport = null;
    try{ lastExport = localStorage.getItem(DataStore.EXPORT_DATE_KEY); }catch(e){}
    return lastExport ? (Date.now() - new Date(lastExport).getTime()) / 86400000 : Infinity;
  }

  // --- auto-backup (File System Access API) ---------------------------------
  get hasAutoBackup(){ return this.autoBackupFileHandle !== null; }
  get autoBackupFileName(){ return this.autoBackupFileHandle ? this.autoBackupFileHandle.name : null; }

  async enableAutoBackup(){
    const handle = await window.showSaveFilePicker({
      suggestedName: 'suivi-service-sauvegarde.json',
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    });
    this.autoBackupFileHandle = handle;
    await this._idbSet('backup-handle', handle);
  }

  async disableAutoBackup(){
    this.autoBackupFileHandle = null;
    try{ await this._idbDelete('backup-handle'); }catch(e){}
  }

  // The handle itself is stashed in IndexedDB so we can try to reuse it on
  // the next visit (still asks for permission again, since that's how the
  // API works).
  async restoreAutoBackupHandle(){
    if(!DataStore.supportsAutoBackup) return;
    try{
      const handle = await this._idbGet('backup-handle');
      if(handle){
        const perm = await handle.queryPermission({ mode: 'readwrite' });
        if(perm === 'granted' || perm === 'prompt') this.autoBackupFileHandle = handle;
      }
    }catch(e){ /* no auto-backup configured */ }
  }

  // Re-requests permission if it's not already granted. Silently returns
  // false on any failure so callers can keep working without it.
  async writeAutoBackup(state){
    if(!this.autoBackupFileHandle) return false;
    try{
      let perm = await this.autoBackupFileHandle.queryPermission({ mode: 'readwrite' });
      if(perm !== 'granted') perm = await this.autoBackupFileHandle.requestPermission({ mode: 'readwrite' });
      if(perm !== 'granted') return false;
      const writable = await this.autoBackupFileHandle.createWritable();
      await writable.write(JSON.stringify(await this.buildBackupObject(state), null, 2));
      await writable.close();
      this.recordExportNow();
      return true;
    }catch(err){
      console.error('Failed to write auto-backup', err);
      return false;
    }
  }

  // --- Minimal IndexedDB key/value helpers, private to this class — just
  // enough to store and retrieve the auto-backup FileSystemFileHandle. ----
  _idbOpen(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('serve-tracker-db', 1);
      req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async _idbGet(key){
    const db = await this._idbOpen();
    return new Promise((resolve, reject) => {
      const r = db.transaction('kv', 'readonly').objectStore('kv').get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }
  async _idbSet(key, value){
    const db = await this._idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async _idbDelete(key){
    const db = await this._idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
}

}

}

// Called by the three serve buttons — increments one counter, repaints,
// and saves. This is the only place `state` is mutated during a session.
function bump(key){
  state[key]++;
  renderCurrentTennisSession();
  saveLatestTennisSession();
}

function defaultSessionName(){
  const d = new Date();
  const loc = t('locale');
  const date = d.toLocaleDateString(loc);
  const time = d.toLocaleTimeString(loc, { hour:'2-digit', minute:'2-digit' });
  return date + ' ' + time;
}

async function loadHistoryList(){
  return dataStore.loadHistory();
}

async function saveHistoryList(list){
  return dataStore.saveHistory(list);
}

async function addSessionToHistory(name){
  return dataStore.addSessionToHistory(name, state);
}

async function renderHistoryPanel(){
  const list = await loadHistoryList();
  const el = document.getElementById('history-list');
  if(list.length === 0){
    el.innerHTML = '<div class="hist-empty">' + t('emptyHistory') + '</div>';
    return;
  }
  const loc = t('locale');
  el.innerHTML = list.map((s, i) => {
    const total = s.first + s.second + s.fault;
    const d = new Date(s.date);
    const dateStr = d.toLocaleDateString(loc) + ' ' + d.toLocaleTimeString(loc, {hour:'2-digit', minute:'2-digit'});
    return '<div class="hist-item">' +
      '<div><div class="hist-name">' + escapeHtml(s.name) + '</div><div class="hist-date">' + dateStr + '</div></div>' +
      '<div class="hist-stats">' + total + ' ' + t('pts') + '<br>' + percent(s.first, total) + '% / ' + percent(s.second, total) + '% / ' + percent(s.fault, total) + '%</div>' +
      '<button class="hist-delete" data-idx="' + i + '">' + t('delete') + '</button>' +
      '</div>';
  }).join('');

  el.querySelectorAll('.hist-delete').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm(t('deleteConfirm'))) return;
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      const current = await loadHistoryList();
      current.splice(idx, 1);
      await saveHistoryList(current);
      renderHistoryPanel();
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function buildBackupObject(){
  return dataStore.buildBackupObject(state);
}

async function writeAutoBackup(){
  const wrote = await dataStore.writeAutoBackup(state);
  if(wrote) hideExportBanner();
  return wrote;
}

async function enableAutoBackup(){
  try{
    await dataStore.enableAutoBackup();
    await writeAutoBackup();
    renderAutoBackupRow();
  }catch(err){
    // user cancelled the picker — nothing to do
  }
}

async function disableAutoBackup(){
  await dataStore.disableAutoBackup();
  renderAutoBackupRow();
}

function renderAutoBackupRow(){
  const row = document.getElementById('auto-backup-row');
  if(!DataStore.supportsAutoBackup){ row.classList.remove('show'); return; }
  row.classList.add('show');
  if(dataStore.hasAutoBackup){
    row.innerHTML = '<span class="auto-backup-status">🔗 ' + escapeHtml(dataStore.autoBackupFileName) + '</span>' +
      '<button id="disable-auto-backup-btn">' + t('disableAutoBackupBtn') + '</button>';
    document.getElementById('disable-auto-backup-btn').addEventListener('click', disableAutoBackup);
  }else{
    row.innerHTML = '<button id="enable-auto-backup-btn">' + t('enableAutoBackupBtn') + '</button>';
    document.getElementById('enable-auto-backup-btn').addEventListener('click', enableAutoBackup);
  }
}

// --- EvolutionPane: the "Trends" tab (model + the canvas it's painted to) ---
class EvolutionPane {
  computeSeries(historyList){
    const chrono = historyList.slice().reverse(); // oldest to newest
    const sessionCount = chrono.length;

    const series = ['first', 'second', 'fault'].map(key => ({
      key,
      color: colors[key],
      points: chrono.map((session, index) => {
        const total = session.first + session.second + session.fault;
        return { index, percentage: percent(session[key], total) };
      }),
    }));

    return { sessionCount, series };
  }

  // Draws one line per outcome (first/second/fault), each session's
  // percentage of its own total, oldest to newest left-to-right.
  async render(){
    const list = await dataStore.loadHistory();
    const canvas = document.getElementById('evo-chart');
    const container = canvas.parentElement;
    const w = Math.max(container.clientWidth - 4, 100);
    const h = 180;
    canvas.width = w;
    canvas.height = h;
    const c = canvas.getContext('2d');
    c.clearRect(0, 0, w, h);

    const { sessionCount, series } = this.computeSeries(list);

    if(sessionCount === 0){
      c.fillStyle = '#7C9285';
      c.font = '13px Inter';
      c.textAlign = 'center';
      c.fillText(t('notEnoughSessions'), w/2, h/2);
      return;
    }

    const pad = { top: 12, right: 10, bottom: 10, left: 30 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    c.strokeStyle = '#2A4433';
    c.fillStyle = '#7C9285';
    c.font = '9px Inter';
    c.textAlign = 'right';
    c.lineWidth = 1;
    [0, 25, 50, 75, 100].forEach(v => {
      const y = pad.top + plotH - (v/100)*plotH;
      c.beginPath();
      c.moveTo(pad.left, y);
      c.lineTo(w - pad.right, y);
      c.stroke();
      c.fillText(v + '%', pad.left - 4, y + 3);
    });

    const n = sessionCount;
    const xAt = i => pad.left + (n === 1 ? plotW/2 : (i/(n-1)) * plotW);
    const yAt = v => pad.top + plotH - (v/100) * plotH;

    // draw order first/fault/second (not the array's own order) so the
    // 2nd-serve line always ends up on top, easiest to misread if buried
    const drawOrder = ['first', 'fault', 'second'];
    drawOrder.forEach(key => {
      const s = series.find(item => item.key === key);
      c.lineJoin = 'round';
      c.lineCap = 'round';

      // dark outline first, so each line reads clearly against the background and against other lines
      c.strokeStyle = 'rgba(10,17,13,0.9)';
      c.lineWidth = 4.5;
      c.beginPath();
      s.points.forEach((p, i) => {
        const x = xAt(p.index), y = yAt(p.percentage);
        if(i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      });
      c.stroke();

      // colored line drawn on top of the outline
      c.strokeStyle = s.color;
      c.lineWidth = 2.5;
      c.beginPath();
      s.points.forEach((p, i) => {
        const x = xAt(p.index), y = yAt(p.percentage);
        if(i === 0) c.moveTo(x, y); else c.lineTo(x, y);
      });
      c.stroke();

      s.points.forEach((p) => {
        const x = xAt(p.index), y = yAt(p.percentage);
        c.beginPath();
        c.arc(x, y, 3, 0, Math.PI*2);
        c.fillStyle = 'rgba(10,17,13,0.9)';
        c.fill();
        c.beginPath();
        c.arc(x, y, 2, 0, Math.PI*2);
        c.fillStyle = s.color;
        c.fill();
      });
    });
  }
}

const evolutionPane = new EvolutionPane();

document.getElementById('history-close').addEventListener('click', () => {
  document.getElementById('history-overlay').classList.remove('open');
});

// Reset flow: a single prompt combines "save?" and "what name?" — Cancel
// means don't save, any other answer (even empty) saves under a name.
document.getElementById('reset-btn').addEventListener('click', async () => {
  const total = state.first + state.second + state.fault;
  if(total > 0){
    const name = prompt(t('saveSessionPrompt'), defaultSessionName());
    if(name !== null){
      await addSessionToHistory(name.trim() || defaultSessionName());
      await writeAutoBackup();
    }
  }
  state = { first:0, second:0, fault:0 };
  renderCurrentTennisSession();
  saveLatestTennisSession();
});

async function exportDB(){
  const backup = await buildBackupObject();
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'suivi-service-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  // Deferred a beat so the browser has time to actually start the
  // download before we revoke the blob URL — revoking too early can
  // silently cancel a download in some browsers.
  setTimeout(async () => {
    URL.revokeObjectURL(url);
    await writeAutoBackup();
    dataStore.recordExportNow();
    hideExportBanner();
  }, 300);
}

function hideExportBanner(){
  document.getElementById('export-banner').classList.remove('show');
}

// Shows the reminder banner if it's been 7+ days (or never) since the
// last export/sync, but only when there's actually history worth backing up.
async function checkExportReminder(){
  const history = await loadHistoryList();
  if(history.length === 0) return;
  if(dataStore.daysSinceLastExport() >= 7){
    document.getElementById('export-banner').classList.add('show');
  }
}

document.getElementById('export-btn').addEventListener('click', exportDB);
document.getElementById('banner-export-btn').addEventListener('click', exportDB);
document.getElementById('banner-dismiss-btn').addEventListener('click', hideExportBanner);

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.history) || typeof data.currentSession !== 'object'){
      throw new Error('invalid format');
    }
    if(!confirm(t('importConfirm'))) return;

    state = {
      first: data.currentSession.first || 0,
      second: data.currentSession.second || 0,
      fault: data.currentSession.fault || 0
    };
    await saveLatestTennisSession();
    await saveHistoryList(data.history);
    renderCurrentTennisSession();
    await renderHistoryPanel();
    alert(t('importSuccess'));
  }catch(err){
    alert(t('importError'));
  }
});

// --- AppUpdater: registers service-worker.js and drives the "new version
// available" banner. Doesn't run over file:// or in browsers without the
// API — the app just keeps loading over the network each time in that
// case, same as before this existed.
class AppUpdater {
  async register(){
    if(!('serviceWorker' in navigator) || !window.isSecureContext) return;
    try{
      this.registration = await navigator.serviceWorker.register('service-worker.js');
      this.registration.addEventListener('updatefound', () => this._onUpdateFound());
      navigator.serviceWorker.addEventListener('controllerchange', () => this._onControllerChange());
    }catch(e){
      // registration failed — app still works, just without offline support
    }
  }

  _onUpdateFound(){
    const newWorker = this.registration.installing;
    if(!newWorker) return;
    newWorker.addEventListener('statechange', () => {
      // navigator.serviceWorker.controller is only set once a previous
      // version already controls the page — i.e. this is an update, not
      // the very first install, which needs no banner.
      if(newWorker.state === 'installed' && navigator.serviceWorker.controller){
        renderUpdateBanner(newWorker);
      }
    });
  }

  _onControllerChange(){
    if(this._reloadedForUpdate) return;
    this._reloadedForUpdate = true;
    window.location.reload();
  }

  applyUpdate(waitingWorker){
    waitingWorker.postMessage({ type: 'SKIP_WAITING' });
  }
}

const appUpdater = new AppUpdater();

function renderUpdateBanner(waitingWorker){
  document.getElementById('update-banner').classList.add('show');
  document.getElementById('update-reload-btn').addEventListener('click', () => {
    appUpdater.applyUpdate(waitingWorker);
  }, { once: true });
}

populateUILanguageSelector();
loadLatestTennisSession();
checkExportReminder();
tryRestoreAutoBackupHandle();
appUpdater.register();
</script>
