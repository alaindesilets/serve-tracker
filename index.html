<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Serve Tracker</title>
<meta name="theme-color" content="#14231A">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --court:      #14231A;
    --surface:    #1D3226;
    --surface-2:  #26402F;
    --line:       #EDEAE1;
    --muted:      #7C9285;
    --first:      #4E9B5E;
    --second:     #E8C93D;
    --fault:      #D6483F;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--court);
    color: var(--line);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    padding: 14px 14px 16px;
  }

  /* header */
  header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
  h1{
    font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:0.04em;
    text-transform:uppercase; font-size:15px; color: var(--muted); margin:0;
  }
  #reset-btn, #history-btn{
    background:none; border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.03em;
    padding:6px 10px; border-radius:20px; text-transform:uppercase;
  }
  #reset-btn:active, #history-btn:active{ background:var(--surface-2); color:var(--line); }

  #lang-select{
    background:var(--court); border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.03em;
    padding:6px 8px; border-radius:20px; text-transform:uppercase;
  }
  #help-btn{
    background:none; border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Oswald',sans-serif; font-weight:600; font-size:12px;
    width:26px; height:26px; border-radius:50%; padding:0; line-height:1;
  }
  #help-btn:active{ background:var(--surface-2); color:var(--line); }

  #export-banner{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border-radius:14px; padding:9px 12px;
    margin-bottom:8px; font-size:11px; color:var(--line);
  }
  #export-banner.show{ display:flex; }
  #banner-export-btn{
    background:var(--first); color:#14231A; border:none;
    font-family:'Inter',sans-serif; font-weight:600; font-size:11px;
    padding:5px 10px; border-radius:12px; text-transform:uppercase;
  }
  #banner-dismiss-btn{
    background:none; border:none; color:var(--muted); font-size:14px; padding:2px 4px;
  }

  #history-overlay, #help-overlay{
    display:none; position:fixed; inset:0; background:rgba(10,17,13,0.88);
    z-index:10; padding:14px;
  }
  #history-overlay.open, #help-overlay.open{ display:flex; }
  #history-panel, #help-panel{
    background:var(--surface); border-radius:18px; width:100%; max-height:100%;
    display:flex; flex-direction:column; overflow:hidden; margin:auto;
  }
  #history-head, #help-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; border-bottom:1px solid var(--surface-2);
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em; font-size:14px;
  }
  #history-close, #help-close{
    background:none; border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Inter',sans-serif; font-size:11px; padding:5px 9px; border-radius:16px; text-transform:uppercase;
  }
  #help-body{
    overflow-y:auto; padding:14px 18px 20px; font-size:13px; line-height:1.55;
  }
  #help-body h3{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.03em;
    font-size:12px; color:var(--first); margin:16px 0 6px;
  }
  #help-body h3:first-child{ margin-top:0; }
  #help-body p, #help-body li{ color:var(--line); margin:0 0 4px; }
  #help-body ul{ margin:4px 0 4px 18px; padding:0; }
  #help-body b{ color:var(--second); }
  #history-list{ overflow-y:auto; padding:8px 16px 16px; }
  .hist-item{
    padding:10px 0; border-bottom:1px solid var(--surface-2);
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .hist-item:last-child{ border-bottom:none; }
  .hist-name{ font-weight:600; font-size:13px; }
  .hist-date{ font-size:11px; color:var(--muted); margin-top:2px; }
  .hist-stats{ font-family:'Oswald',sans-serif; font-size:12px; color:var(--muted); text-align:right; white-space:nowrap; }
  .hist-delete{
    background:none; border:1px solid var(--fault); color:var(--fault);
    font-family:'Inter',sans-serif; font-size:10px; padding:5px 8px; border-radius:14px;
    text-transform:uppercase; flex:0 0 auto;
  }
  .hist-delete:active{ background:var(--fault); color:#F5E9E6; }
  .hist-empty{ color:var(--muted); font-size:13px; text-align:center; padding:24px 0; }

  #history-tabs{ display:flex; gap:8px; padding:12px 16px 0; flex-wrap:wrap; row-gap:8px; }
  .hist-tab{
    background:none; border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.03em;
    padding:6px 12px; border-radius:16px; text-transform:uppercase;
  }
  .hist-tab.active{ background:var(--surface-2); color:var(--line); }

  #export-btn, #import-btn{
    background:none; border:1px solid var(--surface-2); color:var(--muted);
    font-family:'Inter',sans-serif; font-size:11px; letter-spacing:0.03em;
    padding:6px 12px; border-radius:16px; text-transform:uppercase;
  }
  #export-btn{ margin-left:auto; }
  #export-btn:active, #import-btn:active{ background:var(--surface-2); color:var(--line); }

  #link-row{
    display:none; align-items:center; justify-content:space-between; gap:8px;
    margin:10px 16px 0; padding:8px 10px; background:var(--surface-2); border-radius:12px;
  }
  #link-row.show{ display:flex; }
  .link-status{ font-size:11px; color:var(--line); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #link-btn, #unlink-btn{
    background:none; border:1px solid var(--muted); color:var(--line);
    font-family:'Inter',sans-serif; font-size:11px; padding:5px 10px; border-radius:14px;
    text-transform:uppercase; flex:0 0 auto;
  }

  #history-chart-view{ display:none; padding:6px 16px 16px; }
  #evo-chart{ width:100%; display:block; }
  #evo-legend{ display:flex; gap:14px; justify-content:center; margin-top:8px; }
  #evo-legend span{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
  #evo-legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  #evo-note{ text-align:center; font-size:10px; color:var(--muted); margin-top:6px; }

  /* stats zone */
  #stats{
    background:var(--surface);
    border-radius:18px;
    padding: 12px 14px 14px;
    display:flex; align-items:center; gap:14px;
    flex: 0 0 auto;
  }
  #chart-wrap{ position:relative; width:104px; height:104px; flex:0 0 auto; }
  canvas{ display:block; }
  #chart-center{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  #chart-center .n{ font-family:'Oswald',sans-serif; font-size:26px; font-weight:600; line-height:1; }
  #chart-center .lbl{ font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-top:2px; }

  #legend{ flex:1; display:flex; flex-direction:column; gap:7px; min-width:0; }
  .leg-row{ display:flex; align-items:center; gap:8px; }
  .dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .leg-text{ display:flex; flex-direction:column; flex:1; min-width:0; }
  .leg-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; }
  .leg-value{ font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; }
  .leg-value span{ color:var(--muted); font-family:'Inter',sans-serif; font-size:11px; font-weight:400; margin-left:7px; }

  /* second-serve save rate, subtle secondary line */
  #sub-stat{
    text-align:center; font-size:11px; color:var(--muted); margin: 8px 2px 0;
    letter-spacing:0.01em;
  }
  #sub-stat b{ color:var(--line); font-weight:600; }

  /* buttons */
  #buttons{
    flex:1; display:flex; flex-direction:column; gap:12px; margin-top:14px; min-height:0;
  }
  button.serve{
    flex:1; border:none; border-radius:20px;
    font-family:'Oswald',sans-serif; font-weight:600; text-transform:uppercase;
    letter-spacing:0.03em; font-size:22px;
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.06s ease;
    color: #14231A;
  }
  button.serve:active{ transform: scale(0.97); }
  #btn-first{ background: var(--first); }
  #btn-second{ background: var(--second); }
  #btn-fault{ background: var(--fault); color:#F5E9E6; flex:0 0 22%; font-size:19px; }

  button.serve .count{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    margin-left:10px; padding:2px 9px; border-radius:12px;
    background: rgba(20,35,26,0.18);
  }
  #btn-fault .count{ background: rgba(0,0,0,0.18); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 data-i18n="title">Session de service</h1>
    <div style="display:flex; gap:8px; align-items:center;">
      <select id="lang-select"></select>
      <button id="help-btn">?</button>
      <button id="history-btn" data-i18n="history">Historique</button>
      <button id="reset-btn" data-i18n="reset">Réinitialiser</button>
    </div>
  </header>

  <div id="export-banner">
    <span data-i18n="exportReminder">Pense à exporter tes données de temps en temps.</span>
    <div style="display:flex; gap:6px;">
      <button id="banner-export-btn" data-i18n="exportBtn">Exporter</button>
      <button id="banner-dismiss-btn">✕</button>
    </div>
  </div>

  <div id="help-overlay">
    <div id="help-panel">
      <div id="help-head">
        <span data-i18n="helpTitle">Aide</span>
        <button id="help-close" data-i18n="close">Fermer</button>
      </div>
      <div id="help-body"></div>
    </div>
  </div>

  <div id="history-overlay">
    <div id="history-panel">
      <div id="history-head">
        <span data-i18n="historyTitle">Historique des sessions</span>
        <button id="history-close" data-i18n="close">Fermer</button>
      </div>
      <div id="history-tabs">
        <button class="hist-tab active" data-view="list" data-i18n="tabList">Liste</button>
        <button class="hist-tab" data-view="chart" data-i18n="tabChart">Évolution</button>
        <button id="export-btn" data-i18n="exportBtn">Exporter</button>
        <button id="import-btn" data-i18n="importBtn">Importer</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;">
      </div>
      <div id="link-row"></div>
      <div id="history-list"></div>
      <div id="history-chart-view">
        <canvas id="evo-chart" height="180"></canvas>
        <div id="evo-legend">
          <span><i style="background:var(--first)"></i><span data-i18n="firstServe">1er service</span></span>
          <span><i style="background:var(--second)"></i><span data-i18n="secondServe">2e service</span></span>
          <span><i style="background:var(--fault)"></i><span data-i18n="doubleFault">Double faute</span></span>
        </div>
        <div id="evo-note" data-i18n="chronoNote">Sessions dans l'ordre chronologique (gauche → droite)</div>
      </div>
    </div>
  </div>

  <div id="stats">
    <div id="chart-wrap">
      <canvas id="chart" width="104" height="104"></canvas>
      <div id="chart-center">
        <div class="n" id="total-n">0</div>
        <div class="lbl" data-i18n="points">points</div>
      </div>
    </div>
    <div id="legend">
      <div class="leg-row">
        <div class="dot" style="background:var(--first)"></div>
        <div class="leg-text">
          <div class="leg-label" data-i18n="firstServe">1er service</div>
          <div class="leg-value" id="leg-first">0<span>0%</span></div>
        </div>
      </div>
      <div class="leg-row">
        <div class="dot" style="background:var(--second)"></div>
        <div class="leg-text">
          <div class="leg-label" data-i18n="secondServe">2e service</div>
          <div class="leg-value" id="leg-second">0<span>0%</span></div>
        </div>
      </div>
      <div class="leg-row">
        <div class="dot" style="background:var(--fault)"></div>
        <div class="leg-text">
          <div class="leg-label" data-i18n="doubleFault">Double faute</div>
          <div class="leg-value" id="leg-fault">0<span>0%</span></div>
        </div>
      </div>
    </div>
  </div>

  <div id="sub-stat"><span data-i18n="secondRateLabel">Taux de réussite au 2e service : </span><b id="second-rate">—</b></div>

  <div id="buttons">
    <button class="serve" id="btn-first"><span data-i18n="firstServe">1er service</span> <span class="count" id="c-first">0</span></button>
    <button class="serve" id="btn-second"><span data-i18n="secondServe">2e service</span> <span class="count" id="c-second">0</span></button>
    <button class="serve" id="btn-fault"><span data-i18n="doubleFault">Double faute</span> <span class="count" id="c-fault">0</span></button>
  </div>
</div>

<script>
// --- i18n ---------------------------------------------------------------
// Add a new language by adding a block below with the same keys as fr/en.
// The <select> and every element with [data-i18n] update automatically.
const LANG_KEY = 'app-lang';

const translations = {
  fr: {
    langName: 'Français',
    locale: 'fr-CA',
    title: 'Session de service',
    reset: 'Réinitialiser',
    history: 'Historique',
    historyTitle: 'Historique des sessions',
    close: 'Fermer',
    tabList: 'Liste',
    tabChart: 'Évolution',
    points: 'points',
    firstServe: '1er service',
    secondServe: '2e service',
    doubleFault: 'Double faute',
    secondRateLabel: 'Taux de réussite au 2e service : ',
    delete: 'Suppr.',
    emptyHistory: "Aucune session sauvegardée pour l'instant.",
    saveSessionPrompt: 'Sauvegarder la session ?',
    deleteConfirm: "Supprimer cette session de l'historique ?",
    chronoNote: "Sessions dans l'ordre chronologique (gauche → droite)",
    notEnoughSessions: 'Pas encore assez de sessions.',
    shots: 'coups',
    pts: 'pts',
    exportBtn: 'Exporter',
    importBtn: 'Importer',
    importConfirm: 'Remplacer les données actuelles par celles de ce fichier ?',
    importSuccess: 'Données restaurées avec succès.',
    importError: "Ce fichier n'est pas une sauvegarde valide.",
    exportReminder: 'Pense à exporter tes données de temps en temps.',
    linkBtn: 'Lier un fichier de sauvegarde',
    unlinkBtn: 'Délier',
    linkFailed: "Impossible de lier ce fichier.",
    helpTitle: 'Aide',
    helpBody: `
      <p>Cette appli t'aide à comptabiliser les résultats de ton service pendant ta routine de pratique au tennis : 1er service réussi, 2e service réussi, ou double faute — avec des statistiques et un historique pour suivre ta progression.</p>

      <h3>Les trois boutons</h3>
      <p><b>1er service</b> : touche-le quand ton premier service rentre.<br>
      <b>2e service</b> : touche-le si tu as manqué le premier mais que le deuxième rentre.<br>
      <b>Double faute</b> : touche-le si les deux services sont manqués.</p>

      <h3>Les statistiques</h3>
      <p>L'anneau en haut montre la répartition de tes trois résultats, avec le total au centre. Le pourcentage (en gros) est affiché avant le nombre de coups (en petit). Une ligne séparée montre ton taux de réussite au 2e service.</p>

      <h3>Réinitialiser</h3>
      <p>Touche <b>Réinitialiser</b> en fin de pratique. Si tu as des points, l'appli demande de sauvegarder la session sous un nom modifiable. Annuler ne sauvegarde rien ; confirmer archive la session dans l'historique.</p>

      <h3>Historique</h3>
      <p>Onglet <b>Liste</b> : tes sessions sauvegardées, chacune avec un bouton <b>Suppr.</b> pour la retirer définitivement de l'historique. Onglet <b>Évolution</b> : un graphique de tes trois taux au fil du temps.</p>

      <h3>Sauvegarder tes données</h3>
      <p>Tes stats vivent dans le navigateur. Utilise <b>Exporter</b> pour télécharger une copie, et <b>Importer</b> pour la recharger au besoin. Si l'option apparaît, <b>Lier un fichier de sauvegarde</b> écrit automatiquement dans un fichier de ton choix à chaque session. Pour un nettoyage courant de Chrome, décoche "Cookies et données de site" et ne coche que "Images et fichiers en cache".</p>

      <h3>Langue</h3>
      <p>Le menu déroulant en haut à gauche bascule toute l'appli entre le français et l'anglais.</p>
    `
  },
  en: {
    langName: 'English',
    locale: 'en-CA',
    title: 'Serve session',
    reset: 'Reset',
    history: 'History',
    historyTitle: 'Session history',
    close: 'Close',
    tabList: 'List',
    tabChart: 'Trends',
    points: 'points',
    firstServe: '1st serve',
    secondServe: '2nd serve',
    doubleFault: 'Double fault',
    secondRateLabel: '2nd serve conversion rate: ',
    delete: 'Delete',
    emptyHistory: 'No sessions saved yet.',
    saveSessionPrompt: 'Save this session?',
    deleteConfirm: 'Delete this session from history?',
    chronoNote: 'Sessions in chronological order (left → right)',
    notEnoughSessions: 'Not enough sessions yet.',
    shots: 'shots',
    pts: 'pts',
    exportBtn: 'Export',
    importBtn: 'Import',
    importConfirm: 'Replace current data with this file\'s data?',
    importSuccess: 'Data restored successfully.',
    importError: 'This file is not a valid backup.',
    exportReminder: 'Consider exporting your data once in a while.',
    linkBtn: 'Link a backup file',
    unlinkBtn: 'Unlink',
    linkFailed: 'Could not link this file.',
    helpTitle: 'Help',
    helpBody: `
      <p>This app helps you track your tennis serve practice results — 1st serve in, 2nd serve in, or double fault — with stats and a history to follow your progress over time.</p>

      <h3>The three buttons</h3>
      <p><b>1st serve</b>: tap when your first serve goes in.<br>
      <b>2nd serve</b>: tap when you missed the first but the second one goes in.<br>
      <b>Double fault</b>: tap when both serves are missed.</p>

      <h3>The stats</h3>
      <p>The ring at the top shows the split between your three outcomes, with the total in the middle. The percentage (large text) is shown before the shot count (small text). A separate line shows your 2nd-serve conversion rate.</p>

      <h3>Resetting</h3>
      <p>Tap <b>Reset</b> when you're done practicing. If you have points logged, the app asks to save the session under an editable name. Cancel saves nothing; confirming archives the session in your history.</p>

      <h3>History</h3>
      <p><b>List</b> tab: your saved sessions, each with a <b>Delete</b> button to permanently remove it from history. <b>Trends</b> tab: a chart of your three rates over time.</p>

      <h3>Backing up your data</h3>
      <p>Your stats live in the browser. Use <b>Export</b> to download a copy, and <b>Import</b> to reload it if needed. If the option shows up, <b>Link a backup file</b> automatically writes to a file of your choice every time a session is saved. For routine Chrome cleanups, uncheck "Cookies and site data" and only check "Cached images and files".</p>

      <h3>Language</h3>
      <p>The dropdown at the top left switches the whole app between French and English.</p>
    `
  }
};

let currentLang = 'fr';

// Shorthand to fetch a translated string for the active language.
function t(key){ return translations[currentLang][key]; }

// Swaps every [data-i18n] element's text, the help panel HTML, and
// re-renders anything that shows translated text (stats, history, chart).
function applyLanguage(lang){
  currentLang = translations[lang] ? lang : 'fr';
  document.documentElement.lang = currentLang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(translations[currentLang][key] !== undefined){
      el.textContent = translations[currentLang][key];
    }
  });
  document.getElementById('help-body').innerHTML = translations[currentLang].helpBody;
  try{ localStorage.setItem(LANG_KEY, currentLang); }catch(e){}
  render();
  if(document.getElementById('history-overlay').classList.contains('open')){
    renderHistoryPanel();
    if(document.getElementById('history-chart-view').style.display !== 'none'){
      renderEvolutionChart();
    }
  }
}

// Populates the language <select> from the translations object and
// restores the last language the user picked (defaults to French).
function initLangSelector(){
  const sel = document.getElementById('lang-select');
  sel.innerHTML = Object.keys(translations).map(code =>
    '<option value="' + code + '">' + translations[code].langName + '</option>'
  ).join('');
  let saved = 'fr';
  try{ saved = localStorage.getItem(LANG_KEY) || 'fr'; }catch(e){}
  sel.value = translations[saved] ? saved : 'fr';
  sel.addEventListener('change', () => applyLanguage(sel.value));
  applyLanguage(sel.value);
}

// --- current session state ----------------------------------------------
// The only three numbers that matter: how many times each button was tapped
// since the last reset. Persisted to localStorage after every change.
const STORAGE_KEY = 'serve-stats';
let state = { first: 0, second: 0, fault: 0 };

const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const colors = { first: '#4E9B5E', second: '#E8C93D', fault: '#D6483F' };

// --- chart model (pure, testable) ------------------------------------
// Computes what the donut chart should show — values, percentages,
// colors, and start/end angles — with no Canvas or DOM involved. This
// is what a test should call to verify the chart is correct; drawChart()
// below is just the "view" that paints whatever this returns.
// Angles are in radians, 0 = 12 o'clock, sweeping clockwise (matches
// what ctx.arc() expects).
function getChartSegments(sessionState){
  const total = sessionState.first + sessionState.second + sessionState.fault;
  if(total === 0){
    return { total: 0, segments: [] };
  }

  const order = [
    { key: 'first',  value: sessionState.first,  color: colors.first },
    { key: 'second', value: sessionState.second, color: colors.second },
    { key: 'fault',  value: sessionState.fault,  color: colors.fault },
  ];

  let start = -Math.PI/2;
  const segments = [];
  order.forEach(item => {
    if(item.value === 0) return;
    const fraction = item.value / total;
    const sweep = fraction * Math.PI * 2;
    segments.push({
      key: item.key,
      value: item.value,
      percentage: Math.round(fraction * 100),
      color: item.color,
      startAngle: start,
      endAngle: start + sweep,
    });
    start += sweep;
  });

  return { total, segments };
}

// Draws the donut chart for the current session (state.first/second/fault).
// Falls back to an empty grey ring when there's no data yet. All the
// "what to draw" logic lives in getChartSegments() above — this function
// only paints it.
function drawChart(){
  const w = canvas.width, h = canvas.height;
  const cx = w/2, cy = h/2, rOuter = w/2 - 4, rInner = rOuter * 0.6;
  ctx.clearRect(0,0,w,h);

  const { total, segments } = getChartSegments(state);

  if(total === 0){
    ctx.beginPath();
    ctx.arc(cx, cy, rOuter, 0, Math.PI*2);
    ctx.strokeStyle = '#2A4433';
    ctx.lineWidth = rOuter - rInner;
    ctx.stroke();
    return;
  }

  segments.forEach(seg => {
    ctx.beginPath();
    ctx.arc(cx, cy, (rOuter+rInner)/2, seg.startAngle, seg.endAngle);
    ctx.lineWidth = rOuter - rInner;
    ctx.strokeStyle = seg.color;
    ctx.stroke();
  });
}


function pct(n, d){ return d === 0 ? 0 : Math.round((n/d)*100); }

// Repaints everything driven by `state`: the donut chart, the total,
// the three legend rows (percentage first, shot count second), and the
// 2nd-serve conversion rate. Call this after any change to `state`.
function render(){
  const total = state.first + state.second + state.fault;
  document.getElementById('total-n').textContent = total;

  document.getElementById('c-first').textContent = state.first;
  document.getElementById('c-second').textContent = state.second;
  document.getElementById('c-fault').textContent = state.fault;

  document.getElementById('leg-first').innerHTML = pct(state.first, total) + '%<span>' + state.first + ' ' + t('shots') + '</span>';
  document.getElementById('leg-second').innerHTML = pct(state.second, total) + '%<span>' + state.second + ' ' + t('shots') + '</span>';
  document.getElementById('leg-fault').innerHTML = pct(state.fault, total) + '%<span>' + state.fault + ' ' + t('shots') + '</span>';

  const secondAttempts = state.second + state.fault;
  document.getElementById('second-rate').textContent =
    secondAttempts === 0 ? '—' : pct(state.second, secondAttempts) + '% (' + state.second + '/' + secondAttempts + ')';

  drawChart();
}

// --- persistence (current session) --------------------------------------
// Plain localStorage — works once the page is opened in a real browser
// (including a local file:// page), but is wiped if the user clears
// Chrome's "cookies and site data".
async function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ console.error('Échec de la sauvegarde', e); }
}

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = { first: parsed.first||0, second: parsed.second||0, fault: parsed.fault||0 };
    }
  }catch(e){
    // no saved data yet — keep default state
  }
  render();
}

// Called by the three serve buttons — increments one counter, repaints,
// and saves. This is the only place `state` is mutated during a session.
function bump(key){
  state[key]++;
  render();
  save();
}

document.getElementById('btn-first').addEventListener('click', () => bump('first'));
document.getElementById('btn-second').addEventListener('click', () => bump('second'));
document.getElementById('btn-fault').addEventListener('click', () => bump('fault'));

// --- external Bluetooth remote / pedal support ---------------------------
// Cheap "camera shutter" clickers send a Volume key, which Android
// intercepts before it ever reaches the page — those won't work here.
// A real presentation remote or a footpedal (e.g. AirTurn) sends genuine
// keystrokes instead, which do reach the page as normal keydown events.
// Several common key layouts are recognized at once so most such devices
// work without needing to reconfigure them:
//   - Arrow keys (most presentation clickers): Left = 1st, Up = 2nd, Right = fault
//   - Digits 1 / 2 / 3 (numeric keypad remotes)
//   - Letters J / K / L (a common alternate preset on footpedals)
const REMOTE_KEY_BINDINGS = {
  'ArrowLeft': 'first',  '1': 'first',  'j': 'first',  'J': 'first',
  'ArrowUp':   'second', '2': 'second', 'k': 'second', 'K': 'second',
  'ArrowRight':'fault',  '3': 'fault',  'l': 'fault',  'L': 'fault',
};
document.addEventListener('keydown', (e) => {
  const target = REMOTE_KEY_BINDINGS[e.key];
  if (!target) return;
  e.preventDefault();
  bump(target);
});

// --- session history ------------------------------------------------------
// Each saved session is { name, date (ISO string), first, second, fault }.
// Stored as one JSON array in localStorage, newest entry first (unshift).
const HISTORY_KEY = 'history-sessions';

function defaultSessionName(){
  const d = new Date();
  const loc = t('locale');
  const date = d.toLocaleDateString(loc);
  const time = d.toLocaleTimeString(loc, { hour:'2-digit', minute:'2-digit' });
  return date + ' ' + time;
}

async function loadHistoryList(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* no history yet */ }
  return [];
}

async function saveHistoryList(list){
  try{
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  }catch(e){ console.error('Échec de la sauvegarde de l\'historique', e); }
}

async function addSessionToHistory(name){
  const list = await loadHistoryList();
  list.unshift({
    name: name,
    date: new Date().toISOString(),
    first: state.first,
    second: state.second,
    fault: state.fault
  });
  await saveHistoryList(list);
}

async function renderHistoryPanel(){
  const list = await loadHistoryList();
  const el = document.getElementById('history-list');
  if(list.length === 0){
    el.innerHTML = '<div class="hist-empty">' + t('emptyHistory') + '</div>';
    return;
  }
  const loc = t('locale');
  el.innerHTML = list.map((s, i) => {
    const total = s.first + s.second + s.fault;
    const d = new Date(s.date);
    const dateStr = d.toLocaleDateString(loc) + ' ' + d.toLocaleTimeString(loc, {hour:'2-digit', minute:'2-digit'});
    return '<div class="hist-item">' +
      '<div><div class="hist-name">' + escapeHtml(s.name) + '</div><div class="hist-date">' + dateStr + '</div></div>' +
      '<div class="hist-stats">' + total + ' ' + t('pts') + '<br>' + pct(s.first, total) + '% / ' + pct(s.second, total) + '% / ' + pct(s.fault, total) + '%</div>' +
      '<button class="hist-delete" data-idx="' + i + '">' + t('delete') + '</button>' +
      '</div>';
  }).join('');

  el.querySelectorAll('.hist-delete').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm(t('deleteConfirm'))) return;
      const idx = parseInt(btn.getAttribute('data-idx'), 10);
      const current = await loadHistoryList();
      current.splice(idx, 1);
      await saveHistoryList(current);
      renderHistoryPanel();
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- optional: File System Access API (linked backup file) ---------------
// Lets the user pick a file anywhere on their device that the app writes
// to directly, independent of anything Chrome's "clear site data" can
// touch. Only exposed in browsers/contexts that support it — the whole
// section quietly does nothing (and the UI stays hidden) otherwise.
// The FileSystemFileHandle itself is stashed in IndexedDB so we can try
// to reuse it on the next visit (still asks for permission again, since
// that's how the API works).
const supportsFSA = ('showSaveFilePicker' in window) && window.isSecureContext;
let linkedFileHandle = null;

// Minimal IndexedDB key/value helpers — just enough to store and retrieve
// the linked FileSystemFileHandle across page loads.
function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('suivi-service-db', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('kv'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const r = db.transaction('kv', 'readonly').objectStore('kv').get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbDelete(key){
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function buildBackupObject(){
  const history = await loadHistoryList();
  return { exportedAt: new Date().toISOString(), currentSession: state, history };
}

// Writes the full backup (session + history) to the linked file, if any.
// Re-requests permission if it's not already granted. Silently returns
// false on any failure so callers can keep working without it.
async function writeBackupToLinkedFile(){
  if(!linkedFileHandle) return false;
  try{
    let perm = await linkedFileHandle.queryPermission({ mode: 'readwrite' });
    if(perm !== 'granted') perm = await linkedFileHandle.requestPermission({ mode: 'readwrite' });
    if(perm !== 'granted') return false;
    const writable = await linkedFileHandle.createWritable();
    await writable.write(JSON.stringify(await buildBackupObject(), null, 2));
    await writable.close();
    try{ localStorage.setItem(EXPORT_DATE_KEY, new Date().toISOString()); }catch(e){}
    hideExportBanner();
    return true;
  }catch(err){
    console.error('Échec de l\'écriture du fichier lié', err);
    return false;
  }
}

async function linkBackupFile(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'suivi-service-sauvegarde.json',
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    });
    linkedFileHandle = handle;
    await idbSet('backup-handle', handle);
    await writeBackupToLinkedFile();
    renderLinkRow();
  }catch(err){
    // user cancelled the picker — nothing to do
  }
}

async function unlinkBackupFile(){
  linkedFileHandle = null;
  try{ await idbDelete('backup-handle'); }catch(e){}
  renderLinkRow();
}

function renderLinkRow(){
  const row = document.getElementById('link-row');
  if(!supportsFSA){ row.classList.remove('show'); return; }
  row.classList.add('show');
  if(linkedFileHandle){
    row.innerHTML = '<span class="link-status">🔗 ' + escapeHtml(linkedFileHandle.name) + '</span>' +
      '<button id="unlink-btn">' + t('unlinkBtn') + '</button>';
    document.getElementById('unlink-btn').addEventListener('click', unlinkBackupFile);
  }else{
    row.innerHTML = '<button id="link-btn">' + t('linkBtn') + '</button>';
    document.getElementById('link-btn').addEventListener('click', linkBackupFile);
  }
}

async function tryRestoreLinkedHandle(){
  if(!supportsFSA) return;
  try{
    const handle = await idbGet('backup-handle');
    if(handle){
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if(perm === 'granted' || perm === 'prompt') linkedFileHandle = handle;
    }
  }catch(e){ /* no linked file */ }
  renderLinkRow();
}

document.getElementById('help-btn').addEventListener('click', () => {

});
document.getElementById('help-close').addEventListener('click', () => {

document.getElementById('history-btn').addEventListener('click', async () => {

  });
});

// --- trends chart model (pure, testable) --------------------------------
// Computes what the "Trends" line chart should show — one series per
// outcome, each a list of {index, percentage} points in chronological
// order — with no Canvas involved. renderEvolutionChart() below only
// paints whatever this returns.
function getEvolutionSeries(historyList){
  const chrono = historyList.slice().reverse(); // oldest to newest
  const sessionCount = chrono.length;

  const series = ['first', 'second', 'fault'].map(key => ({
    key,
    color: colors[key],
    points: chrono.map((session, index) => {
      const total = session.first + session.second + session.fault;
      return { index, percentage: pct(session[key], total) };
    }),
  }));

  return { sessionCount, series };
}

// Draws the "Trends" line chart: one line per outcome (first/second/fault),
// each session's percentage of its own total, oldest to newest left-to-right.
async function renderEvolutionChart(){
  const list = await loadHistoryList();
  const canvas = document.getElementById('evo-chart');
  const container = canvas.parentElement;
  const w = Math.max(container.clientWidth - 4, 100);
  const h = 180;
  canvas.width = w;
  canvas.height = h;
  const c = canvas.getContext('2d');
  c.clearRect(0, 0, w, h);

  const { sessionCount, series } = getEvolutionSeries(list);

  if(sessionCount === 0){
    c.fillStyle = '#7C9285';
    c.font = '13px Inter';
    c.textAlign = 'center';
    c.fillText(t('notEnoughSessions'), w/2, h/2);
    return;
  }

  const pad = { top: 12, right: 10, bottom: 10, left: 30 };
  const plotW = w - pad.left - pad.right;
  const plotH = h - pad.top - pad.bottom;

  c.strokeStyle = '#2A4433';
  c.fillStyle = '#7C9285';
  c.font = '9px Inter';
  c.textAlign = 'right';
  c.lineWidth = 1;
  [0, 25, 50, 75, 100].forEach(v => {
    const y = pad.top + plotH - (v/100)*plotH;
    c.beginPath();
    c.moveTo(pad.left, y);
    c.lineTo(w - pad.right, y);
    c.stroke();
    c.fillText(v + '%', pad.left - 4, y + 3);
  });

  const n = sessionCount;
  const xAt = i => pad.left + (n === 1 ? plotW/2 : (i/(n-1)) * plotW);
  const yAt = v => pad.top + plotH - (v/100) * plotH;

  // draw order first/fault/second (not the array's own order) so the
  // 2nd-serve line always ends up on top, easiest to misread if buried
  const drawOrder = ['first', 'fault', 'second'];
  drawOrder.forEach(key => {
    const s = series.find(item => item.key === key);
    c.lineJoin = 'round';
    c.lineCap = 'round';

    // dark outline first, so each line reads clearly against the background and against other lines
    c.strokeStyle = 'rgba(10,17,13,0.9)';
    c.lineWidth = 4.5;
    c.beginPath();
    s.points.forEach((p, i) => {
      const x = xAt(p.index), y = yAt(p.percentage);
      if(i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    });
    c.stroke();

    // colored line drawn on top of the outline
    c.strokeStyle = s.color;
    c.lineWidth = 2.5;
    c.beginPath();
    s.points.forEach((p, i) => {
      const x = xAt(p.index), y = yAt(p.percentage);
      if(i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    });
    c.stroke();

    s.points.forEach((p) => {
      const x = xAt(p.index), y = yAt(p.percentage);
      c.beginPath();
      c.arc(x, y, 3, 0, Math.PI*2);
      c.fillStyle = 'rgba(10,17,13,0.9)';
      c.fill();
      c.beginPath();
      c.arc(x, y, 2, 0, Math.PI*2);
      c.fillStyle = s.color;
      c.fill();
    });
  });
}

document.getElementById('history-close').addEventListener('click', () => {
  document.getElementById('history-overlay').classList.remove('open');
});

// Reset flow: a single prompt combines "save?" and "what name?" — Cancel
// means don't save, any other answer (even empty) saves under a name.
document.getElementById('reset-btn').addEventListener('click', async () => {
  const total = state.first + state.second + state.fault;
  if(total > 0){
    const name = prompt(t('saveSessionPrompt'), defaultSessionName());
    if(name !== null){
      await addSessionToHistory(name.trim() || defaultSessionName());
      await writeBackupToLinkedFile();
    }
  }
  state = { first:0, second:0, fault:0 };
  render();
  save();
});

// --- manual backup (download) + export reminder ---------------------------
// The Export button always works (downloads a .json), independent of
// whether a file is linked via the File System Access API above.
const EXPORT_DATE_KEY = 'last-export-date';

async function doExport(){
  const history = await loadHistoryList();
  const backup = {
    exportedAt: new Date().toISOString(),
    currentSession: state,
    history: history
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = 'suivi-service-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  // Deferred a beat so the browser has time to actually start the
  // download before we revoke the blob URL — revoking too early can
  // silently cancel a download in some browsers.
  setTimeout(async () => {
    URL.revokeObjectURL(url);
    await writeBackupToLinkedFile();
    try{ localStorage.setItem(EXPORT_DATE_KEY, new Date().toISOString()); }catch(e){}
    hideExportBanner();
  }, 300);
}

function hideExportBanner(){
  document.getElementById('export-banner').classList.remove('show');
}

// Shows the reminder banner if it's been 7+ days (or never) since the
// last export/sync, but only when there's actually history worth backing up.
async function checkExportReminder(){
  const history = await loadHistoryList();
  if(history.length === 0) return;
  let lastExport = null;
  try{ lastExport = localStorage.getItem(EXPORT_DATE_KEY); }catch(e){}
  const daysSince = lastExport ? (Date.now() - new Date(lastExport).getTime()) / 86400000 : Infinity;
  if(daysSince >= 7){
    document.getElementById('export-banner').classList.add('show');
  }
}

document.getElementById('export-btn').addEventListener('click', doExport);
document.getElementById('banner-export-btn').addEventListener('click', doExport);
document.getElementById('banner-dismiss-btn').addEventListener('click', hideExportBanner);

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.history) || typeof data.currentSession !== 'object'){
      throw new Error('format invalide');
    }
    if(!confirm(t('importConfirm'))) return;

    state = {
      first: data.currentSession.first || 0,
      second: data.currentSession.second || 0,
      fault: data.currentSession.fault || 0
    };
    await save();
    await saveHistoryList(data.history);
    render();
    await renderHistoryPanel();
    alert(t('importSuccess'));
  }catch(err){
    alert(t('importError'));
  }
});
